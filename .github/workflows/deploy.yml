name: Build and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Configure Cloudflare deployment
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_D1_DATABASE_ID != ''
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(readFileSync(path, 'utf8'));
          config.name = 'preciouswrks';
          config.d1_databases[0].database_id = process.env.CLOUDFLARE_D1_DATABASE_ID;
          config.d1_databases[0].database_name = 'preciouswrks-enquiries';
          writeFileSync(path, JSON.stringify(config));
          EOF
      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_D1_DATABASE_ID != ''
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
